title: Large Outbound Data Transfer to External Host
id: a1b2c3d4-0013-4a1a-9b1a-000000000013
status: stable
description: Detects a single host sending an unusually large volume of data to an external destination in a short period, indicating possible data exfiltration.
author: Shajee Mushtaque
date: 2026-08-27
references:
    - https://attack.mitre.org/techniques/T1041/
tags:
    - attack.exfiltration
    - attack.t1041
logsource:
    category: network_connection
    product: any
detection:
    selection:
        bytes_out|gte: 104857600
        direction: 'outbound'
    condition: selection
falsepositives:
    - Legitimate large file uploads, backups, or cloud sync operations
level: medium
