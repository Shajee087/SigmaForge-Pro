title: Windows Event Log Cleared
id: a1b2c3d4-0006-4a1a-9b1a-000000000006
status: stable
description: Detects clearing of Windows event logs via wevtutil.exe, a common anti-forensic technique used after an intrusion.
author: Shajee Mushtaque
date: 2026-08-27
references:
    - https://attack.mitre.org/techniques/T1070/001/
tags:
    - attack.defense_evasion
    - attack.t1070.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\wevtutil.exe'
        CommandLine|contains:
            - 'cl '
            - 'clear-log'
    condition: selection
falsepositives:
    - Rare legitimate log maintenance by system administrators
level: high
