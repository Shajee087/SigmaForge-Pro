title: Windows Defender Real-Time Protection Disabled
id: a1b2c3d4-0005-4a1a-9b1a-000000000005
status: stable
description: Detects attempts to disable Windows Defender real-time monitoring via PowerShell, a common defense evasion step before dropping malware.
author: Shajee Mushtaque
date: 2026-08-27
references:
    - https://attack.mitre.org/techniques/T1562/001/
tags:
    - attack.defense_evasion
    - attack.t1562.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'Set-MpPreference'
            - 'DisableRealtimeMonitoring'
    condition: selection
falsepositives:
    - Authorized administrators temporarily disabling AV for legitimate software testing
level: high
