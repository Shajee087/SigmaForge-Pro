title: Suspicious Base64 Encoded PowerShell Command
id: a1b2c3d4-0009-4a1a-9b1a-000000000009
status: stable
description: Detects execution of PowerShell with an encoded command argument, frequently used to obfuscate malicious scripts and evade detection.
author: Shajee Mushtaque
date: 2026-08-27
references:
    - https://attack.mitre.org/techniques/T1059/001/
tags:
    - attack.execution
    - attack.defense_evasion
    - attack.t1059.001
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - '-enc'
            - '-EncodedCommand'
            - '-e '
    condition: selection
falsepositives:
    - Legitimate automation scripts that pass encoded arguments to PowerShell
level: high
