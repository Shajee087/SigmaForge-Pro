title: Suspicious Process Access to LSASS Memory
id: a1b2c3d4-0002-4a1a-9b1a-000000000002
status: stable
description: Detects processes requesting access to LSASS memory, a common technique for credential dumping (e.g. Mimikatz).
author: Shajee Mushtaque
date: 2026-08-27
references:
    - https://attack.mitre.org/techniques/T1003/001/
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess:
            - '0x1010'
            - '0x1410'
            - '0x1438'
            - '0x143a'
            - '0x1fffff'
    filter:
        SourceImage|endswith:
            - '\wermgr.exe'
            - '\werfault.exe'
            - '\MsMpEng.exe'
    condition: selection and not filter
falsepositives:
    - Windows Error Reporting or antivirus engines legitimately accessing LSASS
level: high
